[project]
name = "deli"
version = "0.1.0"
description = "Git-style, shell-native slicer front end for 3D printing"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Don Cruver", email = "donald@cruver.ai" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
deli = "deli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
