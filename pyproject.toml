[project]
name = "deli"
version = "0.1.0"
description = "Git-style, shell-native slicer front end for 3D printing"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Don Cruver", email = "donald@cruver.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "tomlkit>=0.15.1",
]

[project.scripts]
deli = "deli:main"

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Kept between builds so the engine (about 15 minutes to compile) is only built once.
build-dir = "build/{wheel_tag}"
# One wheel per platform: the module uses Python's stable ABI.
wheel.py-api = "cp312"
wheel.exclude = ["**/*.cpp"]
# libslic3r's largest sources need several GB each to compile.
build.tool-args = ["-j8"]

[tool.uv]
# Rebuild the extension when its sources change, not only when this file does.
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/deli/_engine.cpp" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
