[project]
name = "deli"
version = "0.6.1"
description = "CLI-first slicer front end for 3D printing"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "licenses/*.txt"]
authors = [
    { name = "Don Cruver", email = "donald@cruver.ai" }
]
requires-python = ">=3.12"
keywords = ["3d-printing", "slicer", "g-code", "prusaslicer", "orcaslicer", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Printing",
]
dependencies = [
    "tomlkit>=0.15.1",
]

[project.urls]
Homepage = "https://github.com/dcruver/deli-slicer"
Changelog = "https://github.com/dcruver/deli-slicer/blob/main/CHANGELOG.md"
Issues = "https://github.com/dcruver/deli-slicer/issues"
Printers = "https://github.com/dcruver/deli-slicer/blob/main/PRINTERS.md"

[project.scripts]
deli = "deli:main"

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Kept between builds so the engine (about 15 minutes to compile) is only built once.
build-dir = "build/{wheel_tag}"
# One wheel per platform: the module uses Python's stable ABI.
wheel.py-api = "cp312"
wheel.exclude = ["**/*.cpp"]
# libslic3r's largest sources need several GB each to compile.
build.tool-args = ["-j8"]

[tool.uv]
# Rebuild the extension when its sources change, not only when this file does.
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/deli/_engine.cpp" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
