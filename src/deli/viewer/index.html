<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deli view</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; color: #d8dbe0;
               font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  /* Two panels: the print on the left, its parts on the right, each kept above the layer slider. */
  .panel { position: fixed; top: 12px; padding: 10px 14px; background: rgba(27, 30, 35, 0.85);
           border: 1px solid #3a3f48; border-radius: 6px; max-width: 24em;
           max-height: calc(100vh - 90px); box-sizing: border-box; }
  #info { left: 12px; overflow-y: auto; }
  #parts { right: 12px; width: 24em; display: flex; flex-direction: column; }  /* a set width, so the names stay put when the row appears */
  #parts[hidden] { display: none; }
  #partsHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  /* The list scrolls between the head and the selection's row, which stay in view. */
  #partsList { overflow-y: auto; min-height: 0; margin: 0 -14px; padding: 0 14px; user-select: none; }
  #selection { margin-top: 6px; flex: none; }
  .panel .with { display: inline-flex; align-items: center; gap: 2px; }
  .panel input[type="number"] { font: inherit; color: inherit; background: #262a31; border: 1px solid #3a3f48;
                               border-radius: 4px; padding: 1px 4px; width: 3.5em; }
  .panel b { color: #fff; }
  .panel .dim { color: #9aa0a8; }
  .panel .error { color: #ff8a80; }
  .panel .options { margin-top: 10px; padding-top: 10px; border-top: 1px solid #3a3f48; }
  .panel label { cursor: pointer; display: flex; align-items: center; gap: 0.5em; }
  .panel input { margin: 0; }
  .panel .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .panel .tools button { white-space: nowrap; }
  .panel .tools:not(:first-child) { margin-top: 8px; }
  .panel #selection:empty { display: none; }
  .panel [data-part] { cursor: pointer; }
  .panel [data-part]:hover { text-decoration: underline; }
  .panel [data-part].selected { color: #7dc4ff; }
  .panel button { font: inherit; color: inherit; background: #262a31; border: 1px solid #3a3f48; border-radius: 4px;
                 padding: 2px 10px; cursor: pointer; }
  .panel button:hover { border-color: #8a9099; }
  .panel #sliceNow { background: #3e8fd9; border-color: #3e8fd9; color: #fff; padding: 0 10px; }
  .panel button[aria-pressed="true"] { background: #3e8fd9; border-color: #3e8fd9; color: #fff; }
  .panel .plates { display: flex; flex-wrap: wrap; gap: 6px; }
  .panel .unitsRow { margin-top: 2px; display: flex; justify-content: flex-end; }
  .panel .units { display: inline-flex; }
  .panel .units button { border-radius: 0; }
  .panel .units button:first-child { border-radius: 4px 0 0 4px; }
  .panel .units button:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
  .panel .colour-by { margin-top: 10px; padding-top: 10px; border-top: 1px solid #3a3f48; display: flex; gap: 0.5em; align-items: center; }
  .panel select { font: inherit; color: inherit; background: #262a31; border: 1px solid #3a3f48; border-radius: 4px; padding: 1px 4px; }
  .panel .scale { height: 8px; border-radius: 2px; margin-top: 8px; }
  .panel .range { display: flex; justify-content: space-between; color: #9aa0a8; margin-bottom: 6px; }
  .panel .role { display: flex; align-items: center; padding: 0 4px; margin: 0 -4px; border-radius: 3px; cursor: pointer; }
  .panel .role:first-of-type { margin-top: 6px; }
  .panel .role:hover:not(.fixed) { background: #262a31; }
  .panel .role.fixed { cursor: default; }
  .panel .role.off .name { text-decoration: line-through; color: #6b717a; }
  .panel .role.off .swatch { opacity: 0.3; }
  .panel .role.total { border-top: 1px solid #3a3f48; margin-top: 4px; padding-top: 4px; border-radius: 0; }
  .panel .time, .panel .share { color: #9aa0a8; font-variant-numeric: tabular-nums; text-align: right; }
  .panel .time { margin-left: auto; padding-left: 1.5em; }
  .panel .share { width: 3em; }
  #layers label { display: flex; align-items: center; gap: 0.4em; cursor: pointer; color: #9aa0a8; }
  .panel .swatch { display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.5em; border-radius: 2px; }
  #layers { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px;
            align-items: center; padding: 8px 14px; background: rgba(27, 30, 35, 0.85);
            border: 1px solid #3a3f48; border-radius: 6px; white-space: nowrap; }
  #layers[hidden], #layers [hidden], #command[hidden], #command [hidden] { display: none; }
  #command { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: min(90vw, 44em);
             padding: 8px 12px; background: rgba(27, 30, 35, 0.92); border: 1px solid #3a3f48; border-radius: 6px; }
  #commandNote { color: #9aa0a8; }
  #command .line { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  #commandText { font: 13px/1.4 ui-monospace, monospace; color: #fff; overflow-wrap: anywhere; }
  #layers button, #command button { font: inherit; color: inherit; background: #262a31; border: 1px solid #3a3f48;
             border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  #layers button:hover, #command button:hover { border-color: #8a9099; }
  #command button.primary { background: #3e8fd9; border-color: #3e8fd9; color: #fff; }
  #command button:disabled { opacity: 0.6; cursor: wait; }
  #commandOutput { margin: 6px 0 0; font: 13px/1.4 ui-monospace, monospace; color: #d8dbe0; white-space: pre-wrap; }
  #commandOutput.error { color: #ff8a80; }
  #layer { width: min(40vw, 28em); }
  .panel #overhangNote { margin-bottom: 8px; }
  .panel [hidden] { display: none; }
  #measurement { position: fixed; transform: translate(14px, -50%); padding: 4px 8px; pointer-events: none;
                 background: rgba(27, 30, 35, 0.85); border: 1px solid #3a3f48; border-radius: 4px; white-space: nowrap; }
  #measurement[hidden] { display: none; }
  #measurement b { color: #fff; }
  #measurement .dim { color: #9aa0a8; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="panels"><div id="info" class="panel">Connecting to deli…</div><div id="parts" class="panel" hidden></div></div>
<div id="layers" hidden><input type="range" id="layer" min="1" max="1" list="pauseTicks"><span id="layerLabel"></span>
  <label id="onlyLayerBox"><input type="checkbox" id="onlyLayer"> only this layer</label>
  <button type="button" id="pauseHere" title="The command to pause after this layer">Pause here</button></div>
<div id="command" hidden><div id="commandNote"></div><div class="line"><code id="commandText"></code>
  <button type="button" id="applyCommand" class="primary">Apply</button><button type="button" id="copyCommand">Copy</button>
  <button type="button" id="closeCommand" title="Close (Esc)">×</button></div><pre id="commandOutput"></pre></div>
<datalist id="pauseTicks"></datalist>
<div id="measurement" hidden></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
