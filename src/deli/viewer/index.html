<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deli view</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; color: #d8dbe0;
               font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  #info { position: fixed; top: 12px; left: 12px; padding: 10px 14px; background: rgba(27, 30, 35, 0.85);
          border: 1px solid #3a3f48; border-radius: 6px; max-width: 24em; }
  #info b { color: #fff; }
  #info .dim { color: #9aa0a8; }
  #info .error { color: #ff8a80; }
  #info .options { margin-top: 10px; padding-top: 10px; border-top: 1px solid #3a3f48; }
  #info label { cursor: pointer; display: flex; align-items: center; gap: 0.5em; }
  #info input { margin: 0; }
  #info .swatch { display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.5em; border-radius: 2px; }
  #layers { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px;
            align-items: center; padding: 8px 14px; background: rgba(27, 30, 35, 0.85);
            border: 1px solid #3a3f48; border-radius: 6px; white-space: nowrap; }
  #layers[hidden] { display: none; }
  #layer { width: min(40vw, 28em); }
  #measurement { position: fixed; transform: translate(14px, -50%); padding: 4px 8px; pointer-events: none;
                 background: rgba(27, 30, 35, 0.85); border: 1px solid #3a3f48; border-radius: 4px; white-space: nowrap; }
  #measurement[hidden] { display: none; }
  #measurement b { color: #fff; }
  #measurement .dim { color: #9aa0a8; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="info">Connecting to deli…</div>
<div id="layers" hidden><input type="range" id="layer" min="1" max="1" list="pauseTicks"><span id="layerLabel"></span></div>
<datalist id="pauseTicks"></datalist>
<div id="measurement" hidden></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
