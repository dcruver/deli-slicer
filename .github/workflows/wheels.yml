# Builds deli's wheels, one per platform (the engine uses Python's stable ABI, so a wheel
# serves every Python from 3.12 on), and runs the tests against each on a clean machine.
# A tag vX.Y.Z also publishes them as a GitHub release; its version must be pyproject's.
name: wheels

on:
  workflow_dispatch:
  push:
    branches: [ci-wheels]
    tags: ["v*"]

jobs:
  # Before an hour of building: a tag that is not the package's version would give
  # wheels named for one version under a release named for another.
  version:
    name: Tag matches the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but pyproject.toml says $version. Change one to match the other."
            exit 1
          fi

  linux:
    name: Linux x86-64 wheel
    needs: version
    runs-on: ubuntu-24.04
    # An old glibc, so the wheel loads on any distribution from about 2019 on.
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 300
    steps:
      - name: System packages
        run: |
          dnf install -y dbus-devel mesa-libGLU-devel \
            autoconf automake libtool m4 perl-core perl-IPC-Cmd git patch which file
          dnf install -y --enablerepo=powertools texinfo
          /opt/python/cp312-cp312/bin/python -m pip install cmake ninja
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Which PrusaSlicer
        id: engine
        run: echo "sha=$(git rev-parse HEAD:vendor/PrusaSlicer)" >> "$GITHUB_OUTPUT"

      # The dependencies take far longer than deli itself and change only with PrusaSlicer.
      - name: PrusaSlicer's dependencies, from an earlier run
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/deps/destdir
          key: deps-manylinux_2_28-x86_64-${{ steps.engine.outputs.sha }}-${{ hashFiles('ci/build-deps.sh') }}

      - name: Build PrusaSlicer's dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: ci/build-deps.sh

      # Kept as soon as they are built, so a later step failing does not cost them.
      - name: Keep the dependencies for later runs
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/deps/destdir
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build the wheel
        env:
          # libslic3r's largest sources need several GB each; the runner has 16 GB.
          SKBUILD_BUILD_TOOL_ARGS: -j3
        run: python -m pip wheel . --no-deps -w dist

      - name: Make it a manylinux wheel
        run: |
          auditwheel show dist/*.whl || true
          auditwheel -v repair dist/*.whl -w wheelhouse
          ls -l wheelhouse

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unrepaired-linux-x86_64
          path: dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheelhouse/*.whl

  test-linux:
    name: Tests on Ubuntu 22.04
    needs: linux
    # Older than the machine the wheel was built for by hand, which needed glibc 2.43.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the tests slice PrusaSlicer's own test models
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the wheel, not the source
        run: python -m pip install wheelhouse/*.whl pytest
      - name: Run the tests
        run: python -m pytest -q

  sweep:
    name: Every printer OrcaSlicer ships
    needs: linux
    runs-on: ubuntu-22.04
    env:
      # An OrcaSlicer release, so that PRINTERS.md changes only when this does.
      ORCA_REF: v2.4.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # for the cube that is sliced
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install wheelhouse/*.whl
      - name: OrcaSlicer's profiles, as released
        run: |
          git clone --depth 1 --branch "$ORCA_REF" --filter=blob:none --sparse https://github.com/SoftFever/OrcaSlicer orca
          git -C orca sparse-checkout set resources/profiles
      # Says which printers convert and slice; it does not fail the run when some do not.
      - name: Convert each and slice a cube
        run: python ci/sweep.py --orca orca/resources/profiles --label "OrcaSlicer ${ORCA_REF#v}" --ref "$ORCA_REF" --out PRINTERS.md --json printers.json
      - uses: actions/upload-artifact@v4
        with:
          name: printers
          path: |
            PRINTERS.md
            printers.json

  # Every platform's wheel, once its tests pass. A platform added later goes in `needs`;
  # its wheel artifact, named wheel-<platform>, is picked up from there.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheelhouse
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l wheelhouse
          cat > notes.md <<NOTES
          Install the wheel for your platform with pip or uv, for example:

              pip install https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/<wheel file>
              uv tool install https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/<wheel file>

          Each wheel serves Python 3.12 and later. The Linux wheel needs glibc 2.28 or later
          (most distributions from 2019 on).
          NOTES
          # A tag such as v0.2.0-rc1 is published as a pre-release.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" wheelhouse/*.whl --verify-tag --title "deli ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes $pre
